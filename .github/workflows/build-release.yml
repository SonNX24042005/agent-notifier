name: Build and release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create official GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Run automated test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          if [ -d "tests" ]; then
            python3 -m unittest discover tests -v
          else
            echo "No tests directory present, skipping."
          fi

  build-deb:
    name: Build Linux .deb package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Debian/Ubuntu package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-windows:
    name: Build Windows .exe package
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows standalone bundle and installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/anoti-setup.exe
            dist/anoti-windows-portable.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-deb, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Linux deb package
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: release-assets

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
